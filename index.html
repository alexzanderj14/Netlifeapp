<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netlife Feel HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #000; color: #fff; overflow-x: hidden; }
        .tech-bg { background-image: radial-gradient(circle at 50% 50%, rgba(249, 115, 22, 0.08) 0%, transparent 60%), linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px); background-size: 100% 100%, 30px 30px, 30px 30px; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(249, 115, 22, 0.3); border-radius: 10px; }
        .tooltip-z { z-index: 1000 !important; }
    </style>
</head>
<body class="tech-bg min-h-screen flex flex-col items-center justify-between">
    <div id="root" class="flex-grow flex items-center justify-center w-full"></div>

    <footer class="w-full text-center px-4 py-8 z-20">
        <p class="text-zinc-300 text-sm md:text-base font-semibold max-w-2xl mx-auto leading-relaxed drop-shadow-md">
            Haz clic en cada casilla, descubrirás a Netlife más de lo que es. Si ya eres cliente solo descubre en la N los servicios que ya son parte de tu hogar.
        </p>
    </footer>

    <script type="text/babel" data-presets="react">
        const { useState } = React;

        const Gamepad2 = () => <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="6" x2="10" y1="12" y2="12"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="15" x2="15.01" y1="13" y2="13"/><line x1="18" x2="18.01" y1="11" y2="11"/><rect width="20" height="12" x="2" y="6" rx="3"/></svg>;
        const ShieldCheck = () => <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 13c0 5-3.5 7.5-7.66 9.7a1 1 0 0 1-.68 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 .76-.97l8-2a1 1 0 0 1 .48 0l8 2a1 1 0 0 1 .76.97Z"/><path d="m9 12 2 2 4-4"/></svg>;
        const Wifi = () => <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 20h.01"/><path d="M8.5 16.5c3-3 4-3 7 0"/><path d="M5 13a11.5 11.5 0 0 1 14 0"/><path d="M1.5 9.5a19.6 19.6 0 0 1 21 0"/></svg>;
        const Home = () => <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
        const Headset = () => <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 11h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H3a1 1 0 0 1-1-1v-5a9 9 0 0 1 18 0v5a1 1 0 0 1-1 1h-3a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/><path d="M21 16v2a2 2 0 0 1-2 2h-2"/></svg>;
        const BatteryCharging = () => <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 18H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3.19M15 6h2a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-3.19"/><line x1="23" x2="23" y1="11" y2="13"/><polygon points="11 6 7 12 10 12 9 18 13 12 10 12 11 6"/></svg>;
        const Briefcase = () => <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/></svg>;
        const Tv = () => <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect width="20" height="15" x="2" y="7" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>;

        const SERVICES = [
            { id: 'gaming', name: 'Gamer', icon: Gamepad2, color: 'text-purple-400', angle: 270, desc: 'Planes Gamer con rutas optimizadas y menor latencia para jugar al máximo nivel. Que el lag no sea tu enemigo.' },
            { id: 'ciberseguridad', name: 'Ciberseguridad', icon: ShieldCheck, color: 'text-blue-400', angle: 315, desc: 'Netlife Defense, Safe Kids y Password Manager. Blindaje total 24/7 para proteger a los que más amas y tu identidad digital.' },
            { id: 'full_coverage', name: 'Full Cobertura', icon: Wifi, color: 'text-cyan-400', angle: 0, desc: 'Wifi Gi, Extender y Cableado Ethernet. Cobertura inquebrantable en cada rincón de tu hogar, sin zonas muertas.' },
            { id: 'domotica', name: 'Domótica', icon: Home, color: 'text-emerald-400', angle: 45, desc: 'NetlifeCam Indoor y Outdoor. Tu hogar en la palma de tu mano. Control, automatización y vigilancia inteligente.' },
            { id: 'asistencia', name: 'Asistencia', icon: Headset, color: 'text-amber-400', angle: 90, desc: 'Soporte Pro y Premium. No te dejamos solo; nuestros expertos están listos para resolver cualquier desafío técnico.' },
            { id: 'equipamiento', name: 'Equipamiento', icon: BatteryCharging, color: 'text-green-400', angle: 135, desc: 'Mini UPS inteligente. Porque tu vida no puede detenerse por un apagón. Mantente conectado siempre.' },
            { id: 'productividad', name: 'Productividad', icon: Briefcase, color: 'text-indigo-400', angle: 180, desc: 'Netlife Cloud, IP Fija y Constructor Web. Herramientas de grado empresarial para potenciar tu negocio o teletrabajo.' },
            { id: 'entretenimiento', name: 'Entretenimiento', icon: Tv, color: 'text-pink-400', angle: 225, desc: 'Paramount+, Zapping, ECDF. Tus momentos de relax garantizados con el mejor contenido de cine, series y deportes.' }
        ];

        function App() {
            const [selected, setSelected] = useState(null);
            
            return (
                <div className="relative w-[500px] h-[500px] flex items-center justify-center">
                    <div className="w-32 h-32 rounded-full bg-gradient-to-br from-orange-500 to-yellow-600 flex items-center justify-center z-50 shadow-[0_0_50px_rgba(249,115,22,0.6)] cursor-pointer">
                        <span className="text-4xl font-black text-white italic">N</span>
                    </div>

                    {SERVICES.map((s) => {
                        const angleRad = (s.angle * Math.PI) / 180;
                        const dist = 210;
                        const x = Math.cos(angleRad) * dist;
                        const y = Math.sin(angleRad) * dist;
                        
                        return (
                            <div key={s.id} className="absolute flex flex-col items-center" style={{ transform: `translate(${x}px, ${y}px)` }}>
                                <button 
                                    onClick={() => setSelected(selected === s.id ? null : s.id)}
                                    className={`w-16 h-16 rounded-full border-2 border-white/10 bg-zinc-900 flex items-center justify-center transition-all hover:scale-110 ${s.color}`}
                                >
                                    <s.icon />
                                </button>
                                <span className="mt-2 text-xs font-bold text-gray-400">{s.name}</span>
                                
                                {selected === s.id && (
                                    <div className="absolute w-72 p-6 bg-zinc-900/95 border border-orange-500 rounded-2xl text-white text-sm shadow-[0_20px_50px_rgba(0,0,0,0.5)] tooltip-z mt-24">
                                        {s.desc}
                                    </div>
                                )}
                            </div>
                        );
                    })}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
