<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netlife Feel HUB</title>
    
    <!-- Google Fonts: Montserrat para tipografía corporativa premium -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;0,700;0,900;1,800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Fondo de red de energía tecnológica de Netlife */
        .tech-bg {
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(249, 115, 22, 0.08) 0%, transparent 60%),
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        /* Scrollbar del HUD lateral personalizado */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(249, 115, 22, 0.3);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(249, 115, 22, 0.6);
        }

        /* Animaciones personalizadas del reactor y bobinas */
        @keyframes heartbeat-synced {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 25px rgba(249, 115, 22, 0.45), inset 0 0 15px rgba(249, 115, 22, 0.2);
            }
            45% {
                transform: scale(1.018);
                box-shadow: 0 0 45px rgba(249, 115, 22, 0.95), inset 0 0 25px rgba(249, 115, 22, 0.45);
            }
            60% {
                transform: scale(1.006);
                box-shadow: 0 0 32px rgba(249, 115, 22, 0.6), inset 0 0 18px rgba(249, 115, 22, 0.3);
            }
        }
        
        @keyframes central-n-pulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                box-shadow: 0 0 30px rgba(249, 115, 22, 0.45);
            }
            45% {
                transform: translate(-50%, -50%) scale(1.05);
                box-shadow: 0 0 50px rgba(249, 115, 22, 0.85);
            }
            60% {
                transform: translate(-50%, -50%) scale(1.01);
                box-shadow: 0 0 38px rgba(249, 115, 22, 0.6);
            }
        }

        @keyframes electric-spark {
            0%, 100% { 
                filter: drop-shadow(0 0 8px #f97316) drop-shadow(0 0 12px #eab308); 
                stroke: #facc15; 
            }
            15%, 85% { 
                filter: drop-shadow(0 0 4px #ea580c); 
                stroke: #ea580c; 
            }
            30%, 70% { 
                filter: drop-shadow(0 0 15px #f97316) drop-shadow(0 0 25px #ffffff); 
                stroke: #ffffff; 
            }
            50% { 
                filter: drop-shadow(0 0 6px #facc15); 
                stroke: #fcd34d; 
            }
        }

        @keyframes electric-glow-selected {
            0%, 100% { 
                box-shadow: 0 0 15px #f97316, inset 0 0 8px #ea580c, 0 0 10px rgba(249, 115, 22, 0.4); 
                border-color: #facc15; 
            }
            50% { 
                box-shadow: 0 0 28px #eab308, inset 0 0 12px #f97316, 0 0 18px rgba(254, 215, 170, 0.8); 
                border-color: #ffffff; 
              }
        }

        .animate-heartbeat-bioluminescent {
            animation: heartbeat-synced 3s cubic-bezier(0.25, 0.8, 0.25, 1) infinite;
        }

        .animate-central-n {
            animation: central-n-pulse 3s cubic-bezier(0.25, 0.8, 0.25, 1) infinite;
        }

        .animate-electric {
            animation: electric-spark 0.35s infinite;
        }

        .animate-electric-glowing {
            animation: electric-glow-selected 0.4s infinite;
        }
    </style>
</head>
<body class="tech-bg min-h-screen flex items-center select-none cursor-default">

    <!-- Portal Principal / Grid Interactiva -->
    <div class="w-full max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-12 items-center relative z-10 p-6 lg:p-12" onclick="handleBackgroundClick()">
        
        <!-- Brillo ambiental reactivo -->
        <div id="ambient-glow" class="absolute inset-0 transition-opacity duration-1000 pointer-events-none opacity-40">
            <div class="absolute top-1/2 left-1/3 -translate-x-1/2 -translate-y-1/2 w-[850px] h-[850px] bg-gradient-to-r from-orange-600/10 to-yellow-500/5 rounded-full blur-[130px]"></div>
        </div>

        <!-- COLUMNA IZQUIERDA: Ecosistema Radial y Reactor de Potencia -->
        <div class="lg:col-span-7 flex flex-col items-center justify-center relative min-h-[520px]">
            <div class="relative w-[480px] h-[480px] flex items-center justify-center">
                
                <!-- ANILLO BIOLUMINISCENTE PERMANENTE CON LATIDO INTEGRADO -->
                <div 
                  id="permanent-ring"
                  class="absolute w-[390px] h-[390px] rounded-full border border-orange-500/30 pointer-events-none animate-heartbeat-bioluminescent"
                  style="background: rgba(249, 115, 22, 0.012);"
                ></div>

                <!-- CHALECO Y CAPAS DEL REACTOR CENTRAL -->
                <div 
                  id="reactor-shell"
                  class="absolute w-[350px] h-[350px] rounded-full transition-all duration-700 ease-out z-10 scale-100"
                >
                  <div class="absolute inset-0 bg-gradient-to-tr from-orange-600 to-yellow-500 rounded-full opacity-15 blur-xl"></div>
                  
                  <!-- Reactor SVG con 8 bobinas sincronizadas -->
                  <svg viewBox="0 0 200 200" class="w-full h-full transform scale-95 transition-transform duration-500 overflow-visible">
                    <circle 
                      cx="100" 
                      cy="100" 
                      r="92" 
                      fill="#040405" 
                      stroke="#f97316" 
                      stroke-width="0.5" 
                      stroke-opacity="0.15"
                      class="cursor-pointer"
                      onclick="toggleReactor(event)"
                    />
                    
                    <!-- Contenedor dinámico de bobinas (Stark Coils) -->
                    <g id="stark-coils"></g>

                    <circle cx="100" cy="100" r="54" fill="none" stroke="#f97316" stroke-width="0.8" stroke-opacity="0.25" />
                    <circle cx="100" cy="100" r="50" fill="#010102" stroke="#eab308" stroke-width="0.5" stroke-opacity="0.15" />
                  </svg>
                </div>

                <!-- BOTÓN N CENTRAL ALINEADO -->
                <button 
                  onclick="handleNClick(event)"
                  class="absolute z-30 w-24 h-24 bg-gradient-to-br from-orange-500 to-yellow-500 rounded-full flex items-center justify-center transition-all duration-500 group animate-central-n"
                  style="top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 35px rgba(249, 115, 22, 0.45);"
                >
                  <div class="absolute inset-[3px] bg-[#020203] rounded-full flex items-center justify-center overflow-hidden">
                    <span 
                      class="text-5xl font-black italic text-white select-none transition-transform duration-300 group-hover:scale-110"
                      style="font-family: 'Montserrat', sans-serif; text-shadow: 0 0 15px rgba(255,255,255,0.85); transform: skewX(-8deg) translateX(1px);"
                    >
                      N
                    </span>
                  </div>
                </button>

                <!-- Contenedor dinámico para los nodos orbitales de servicios -->
                <div id="orbit-container" class="absolute inset-0 flex items-center justify-center pointer-events-none"></div>

            </div>
        </div>

        <!-- COLUMNA DERECHA: Consola de Control Lateral HUD / Asistente AI -->
        <div class="lg:col-span-5 flex flex-col justify-center min-h-[400px]">
            <div 
              class="bg-gradient-to-b from-zinc-900/50 to-zinc-950/95 backdrop-blur-xl border border-zinc-800/60 p-8 rounded-3xl shadow-[0_25px_60px_rgba(0,0,0,0.6)] transition-all duration-500 flex flex-col justify-center relative overflow-hidden group min-h-[380px]"
              onclick="event.stopPropagation()"
            >
                <div class="absolute top-0 right-0 w-16 h-16 border-t-2 border-r-2 border-orange-500/15 rounded-tr-3xl pointer-events-none transition-colors group-hover:border-orange-500/30"></div>
                
                <!-- Consola dinámica HUD de visualización -->
                <div id="hud-console" class="h-full flex flex-col justify-between"></div>
            </div>
        </div>

    </div>

    <!-- Leyenda Instructiva HUD -->
    <div class="absolute bottom-6 left-0 w-full text-center px-4 pointer-events-none z-20">
        <p class="text-zinc-300 text-xs tracking-wider font-semibold max-w-3xl mx-auto leading-relaxed drop-shadow-md">
            Haz clic en las bobinas de energía para expandir tu ecosistema digital o en la <span class="text-orange-500 font-extrabold">N</span> central para auditar tu plan activo.
        </p>
    </div>

    <!-- VENTANA MODAL DE AUDITORÍA (CONSULTA DE CÉDULA) -->
    <div 
      id="consult-modal" 
      class="absolute inset-0 z-[100] flex items-center justify-center p-6 bg-black/85 backdrop-blur-md hidden"
      onclick="closeConsultModal()"
    >
        <div 
          class="w-full max-w-md bg-zinc-900 border border-orange-500/20 rounded-3xl p-8 shadow-[0_0_60px_rgba(249,115,22,0.2)] relative transform transition-all scale-100"
          onclick="event.stopPropagation()"
        >
            <button onclick="closeConsultModal()" class="absolute top-5 right-5 text-zinc-500 hover:text-white bg-zinc-800 hover:bg-zinc-700 transition-colors rounded-full p-1.5">
              <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
            </button>
            <div class="flex justify-center mb-6 mt-4">
              <div class="relative w-16 h-16">
                <div class="absolute inset-0 border-4 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
                <div class="absolute inset-0 flex items-center justify-center text-orange-400">
                  <svg class="w-6 h-6 animate-pulse" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></svg>
                </div>
              </div>
            </div>
            <h2 class="text-2xl font-black text-center mb-2 tracking-wide">Consulta tu <span class="text-transparent bg-clip-text bg-gradient-to-r from-orange-500 to-yellow-400">Estatus</span></h2>
            <p class="text-center text-zinc-400 text-sm leading-relaxed mb-6 font-light">Ingresa tu número de cédula o código de cliente para escanear en tiempo real las soluciones digitales activas en tu cuenta.</p>
            <div class="space-y-4">
              <input type="text" placeholder="Ej. 17xxxxxxxx" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3.5 text-white placeholder-zinc-600 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-all font-medium text-sm" />
              <button class="w-full py-4 bg-gradient-to-r from-orange-600 to-yellow-500 text-black font-black tracking-wider text-xs uppercase rounded-xl hover:shadow-[0_0_25px_rgba(249,115,22,0.35)] hover:brightness-110 transition-all active:scale-[0.99]" onclick="closeConsultModal()">Escanear mis servicios</button>
            </div>
        </div>
    </div>

    <!-- LÓGICA DE CONTROL HUD Y ESTADOS INTERACTIVOS -->
    <script>
        // Declaración del pool de iconos SVG para Lucide nativo de alto rendimiento
        const SVG_GAMEPAD = `<svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" x2="10" y1="12" y2="12" /><line x1="8" x2="8" y1="10" y2="14" /><line x1="15" x2="15.01" y1="13" y2="13" /><line x1="18" x2="18.01" y1="11" y2="11" /><rect width="20" height="12" x="2" y="6" rx="3" /></svg>`;
        const SVG_SHIELD  = `<svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 9.7a1 1 0 0 1-.68 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 .76-.97l8-2a1 1 0 0 1 .48 0l8 2a1 1 0 0 1 .76.97Z" /><path d="m9 12 2 2 4-4" /></svg>`;
        const SVG_WIFI    = `<svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01" /><path d="M8.5 16.5c3-3 4-3 7 0" /><path d="M5 13a11.5 11.5 0 0 1 14 0" /><path d="M1.5 9.5a19.6 19.6 0 0 1 21 0" /></svg>`;
        const SVG_HOME    = `<svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></svg>`;
        const SVG_HEADSET = `<svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H3a1 1 0 0 1-1-1v-5a9 9 0 0 1 18 0v5a1 1 0 0 1-1 1h-3a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3" /><path d="M21 16v2a2 2 0 0 1-2 2h-2" /></svg>`;
        const SVG_BATTERY = `<svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3.19M15 6h2a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-3.19" /><line x1="23" x2="23" y1="11" y2="13" /><polygon points="11 6 7 12 10 12 9 18 13 12 10 12 11 6" /></svg>`;
        const SVG_CASE    = `<svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" /><rect width="20" height="14" x="2" y="6" rx="2" /></svg>`;
        const SVG_TV      = `<svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="15" x="2" y="7" rx="2" ry="2" /><polyline points="17 2 12 7 7 2" /></svg>`;

        const SERVICES = [
          { 
            id: 'gaming', 
            name: 'Gamer', 
            icon: SVG_GAMEPAD, 
            color: 'text-purple-400', 
            angle: 270, // Top
            desc: 'Planes Gamer con rutas optimizadas y menor latencia para jugar al máximo nivel. Que el lag no sea tu enemigo.',
            links: [{ label: 'Ver plan Gamer Netlife', url: 'https://netlife.ec/plan-gamer-netlife/' }]
          },
          { 
            id: 'ciberseguridad', 
            name: 'Ciberseguridad', 
            icon: SVG_SHIELD, 
            color: 'text-blue-400', 
            angle: 315, // Top-Right
            desc: 'Netlife Defense, Safe Kids y Password Manager. Blindaje total 24/7 para proteger a los que más amas y tu identidad digital.',
            links: [{ label: 'Ver Seguridad Total Defense', url: 'https://netlife.ec/seguridad-total-defense/' }]
          },
          { 
            id: 'full_coverage', 
            name: 'Full Cobertura', 
            icon: SVG_WIFI, 
            color: 'text-cyan-400', 
            angle: 0, // Right
            desc: 'Wifi Gi, Extender y Cableado Ethernet. Cobertura inquebrantable en cada rincón de tu hogar, sin zonas muertas.',
            links: [
              { label: 'Ver especificaciones Wifi Gi', url: 'https://netlife.ec/wifi-gi/' },
              { label: 'Ver Cableado Ethernet', url: 'https://netlife.ec/cableadoethernet/' }
            ]
          },
          { 
            id: 'domotica', 
            name: 'Domótica', 
            icon: SVG_HOME, 
            color: 'text-emerald-400', 
            angle: 45, // Bottom-Right
            desc: 'NetlifeCam Indoor y Outdoor. Tu hogar en la palma de tu mano. Control, automatización y vigilancia inteligente.',
            links: [{ label: 'Ver Netlife Cam', url: 'https://netlife.ec/netlife-cam/' }]
          },
          { 
            id: 'asistencia', 
            name: 'Asistencia', 
            icon: SVG_HEADSET, 
            color: 'text-amber-400', 
            angle: 90, // Bottom
            desc: 'Soporte Pro y Premium. No te dejamos solo; nuestros expertos están listos para resolver cualquier desafío técnico.',
            links: [{ label: 'Ver Asistencia Remota', url: 'https://netlife.ec/asistencia-remota/' }]
          },
          { 
            id: 'equipamiento', 
            name: 'Equipamiento', 
            icon: SVG_BATTERY, 
            color: 'text-green-400', 
            angle: 135, // Bottom-Left
            desc: 'Mini UPS inteligente. Porque tu vida no puede detenerse por un apagón. Mantente conectado siempre.',
            links: [{ label: 'Ver Wifi y Extender Premium', url: 'https://netlife.ec/wifi-y-extender-dual-band-premium/' }]
          },
          { 
            id: 'productividad', 
            name: 'Productividad', 
            icon: SVG_CASE, 
            color: 'text-indigo-400', 
            angle: 180, // Left
            desc: 'Netlife Cloud, IP Fija y Constructor Web. Herramientas de grado empresarial para potenciar tu negocio o teletrabajo.',
            links: [
              { label: 'Ver Netlife Cloud', url: 'https://netlife.ec/netlife-cloud/' },
              { label: 'Ver Constructor de Sitios Web', url: 'https://netlife.ec/constructor-sitios-web-rapido/' }
            ]
          },
          { 
            id: 'entretenimiento', 
            name: 'Entretenimiento', 
            icon: SVG_TV, 
            color: 'text-pink-400', 
            angle: 225, // Top-Left
            desc: 'Paramount+, Zapping, ECDF. Tus momentos de relax garantizados con el mejor contenido de cine, series y deportes.',
            links: [{ label: 'Ver canales de Entretenimiento', url: 'https://netlife.ec/entretenimiento/' }]
          },
        ];

        // Estado Global de la Aplicación
        let isReactorActive = false;
        let selectedService = null;
        let hoveredServiceId = null;
        let showConsultModal = false;
        let showAiDiagnostic = false;
        let aiStep = 1;
        let aiAnswers = {
          householdSize: '1-2',
          remoteActivity: 'none',
          hasGamers: 'no',
          primaryFocus: 'entretenimiento'
        };
        let aiLoading = false;
        let aiResponse = null;
        let aiError = null;

        const radius = 175; // Reducción del radio orbital del 12% para máxima legibilidad vertical

        // Inicializador de la Consola
        window.onload = function() {
            buildSTARKCoils();
            buildOrbitNodes();
            render();
        };

        // Construye las bobinas de energía eléctrica del SVG Stark
        function buildSTARKCoils() {
            const coilsGroup = document.getElementById('stark-coils');
            coilsGroup.innerHTML = SERVICES.map(service => {
                const angle = service.angle + 90;
                return `
                  <g 
                    id="coil-${service.id}"
                    transform="rotate(${angle} 100 100)"
                    class="cursor-pointer"
                    onclick="selectServiceById('${service.id}', event)"
                    onmouseenter="hoverServiceId('${service.id}')"
                    onmouseleave="hoverServiceId(null)"
                  >
                    <path 
                      class="coil-inner transition-all duration-300"
                      d="M93 22 L107 22 L111 42 L89 42 Z" 
                      fill="transparent" 
                      stroke="#eab308" 
                      stroke-width="0.6" 
                      stroke-opacity="0.4"
                    />
                    <path 
                      class="coil-wires transition-all duration-300"
                      d="M95 25 L105 25 M94 29 L106 29 M93 33 L107 33" 
                      fill="none" 
                      stroke="#ca8a04" 
                      stroke-width="0.4" 
                      stroke-opacity="0.3"
                    />
                    <path 
                      class="coil-outer transition-all duration-300"
                      d="M91 18 L109 18 L114 45 L86 45 Z" 
                      fill="transparent" 
                      stroke="#f97316" 
                      stroke-width="0.8" 
                      stroke-opacity="0.6"
                    />
                  </g>
                `;
            }).join('');
        }

        // Calcula el posicionamiento de los tooltips espaciales
        function getTooltipClass(angle) {
          switch(angle) {
            case 0: return "left-[125%] top-1/2 -translate-y-1/2 ml-2"; 
            case 45: return "left-[110%] top-[105%] mt-2"; 
            case 90: return "top-[125%] left-1/2 -translate-x-1/2 mt-2"; 
            case 135: return "right-[110%] top-[105%] mt-2"; 
            case 180: return "right-[125%] top-1/2 -translate-y-1/2 mr-2"; 
            case 225: return "right-[110%] bottom-[105%] mb-2"; 
            case 270: return "bottom-[125%] left-1/2 -translate-x-1/2 mb-2"; 
            case 315: return "left-[110%] bottom-[105%] mb-2"; 
            default: return "left-full ml-4 top-0";
          }
        }

        // Construcción interactiva de los nodos orbitales de servicios
        function buildOrbitNodes() {
            const container = document.getElementById('orbit-container');
            container.innerHTML = SERVICES.map((service, index) => {
                const tooltipPos = getTooltipClass(service.angle);
                return `
                  <div 
                    id="node-${service.id}"
                    class="absolute z-20 transition-all duration-700 ease-[cubic-bezier(0.19,1,0.22,1)] opacity-0 scale-40 pointer-events-none"
                    style="left: calc(50% - 32px); top: calc(50% - 32px); transition-delay: ${index * 35}ms;"
                  >
                    <button
                      onclick="selectServiceById('${service.id}', event)"
                      onmouseenter="hoverServiceId('${service.id}')"
                      onmouseleave="hoverServiceId(null)"
                      class="orbit-btn w-16 h-16 rounded-full bg-zinc-950/95 backdrop-blur-md border border-zinc-800/80 hover:border-zinc-400 hover:bg-zinc-900 flex flex-col items-center justify-center transition-all duration-300 group relative"
                    >
                      <div class="icon-frame ${service.color} transition-transform duration-300 drop-shadow-[0_0_10px_currentColor]">
                        ${service.icon}
                      </div>
                      
                      <div class="label absolute -bottom-6 text-[10px] font-bold tracking-wider text-zinc-400 group-hover:text-white transition-colors duration-300 whitespace-nowrap">
                        ${service.name}
                      </div>
                    </button>

                    <!-- Spatial Tooltip de descripción flotando fuera del domo -->
                    <div 
                      id="tooltip-${service.id}"
                      class="tooltip absolute w-56 p-4 bg-zinc-900/95 backdrop-blur-xl border border-zinc-700 rounded-2xl shadow-[0_15px_30px_rgba(0,0,0,0.8)] z-50 transition-all duration-300 opacity-0 scale-75 pointer-events-none ${tooltipPos}"
                    >

                            <label class="text-[10px] font-bold tracking-wider text-zinc-500 uppercase">Prioridad Máxima del Hogar</label>
                            <div class="grid grid-cols-2 gap-2">
                              ${[
                                { key: 'seguridad', lbl: 'Blindar / Proteger' },
                                { key: 'productividad', lbl: 'Trabajar / Crear' },
                                { key: 'entretenimiento', lbl: 'Stream / Relax' },
                                { key: 'conectividad', lbl: 'Estabilidad Total' }
                              ].map(opt => `
                                <button
                                  onclick="setAiAnswer('primaryFocus', '${opt.key}')"
                                  class="py-2 rounded-xl text-xs font-bold transition-all border ${aiAnswers.primaryFocus === opt.key ? 'bg-orange-500/10 border-orange-500 text-orange-400' : 'bg-zinc-950/80 border-zinc-800 text-zinc-400 hover:border-zinc-700'}"
                                >
                                  ${opt.lbl}
                                </button>
                              `).join('')}
                            </div>
                          </div>

                          <button 
                            onclick="generateAiDiagnostic()"
                            class="w-full mt-4 py-3 bg-gradient-to-r from-orange-600 to-yellow-500 text-black font-black text-xs uppercase tracking-widest rounded-xl hover:shadow-[0_0_20px_rgba(249,115,22,0.45)] hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center space-x-2"
                          >
                            <svg class="w-4 h-4 text-black animate-spin" style="animation-duration: 3s" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275Z" /><path d="m5 3 1 2.5L8.5 6 6 7 5 9.5 4 7 1.5 6 4 5.5Z" /><path d="m19 17 1 2.5 2.5.5-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1Z" /></svg>
                            <span>Escanear Huella de Hogar</span>
                          </button>
                        </div>
                      </div>
                    `;
                }
            } else if (selectedService) {
                // Diseño Original Ajustado Compacto para evitar desconfiguraciones de espacio vertical
                hudContainer.innerHTML = `
                  <div class="flex flex-col space-y-3">
                    <div class="flex items-center space-x-4">
                      <div class="w-14 h-14 rounded-full bg-zinc-950 border border-zinc-700 flex items-center justify-center ${selectedService.color} shadow-[0_0_20px_currentColor]">
                        ${selectedService.icon}
                      </div>
                      <div>
                        <span class="text-[10px] font-bold tracking-[0.2em] text-orange-500 uppercase">Módulo Seleccionado</span>
                        <h3 class="text-2xl font-black text-white tracking-wide">${selectedService.name}</h3>
                      </div>
                    </div>
                    
                    <div class="space-y-3 pt-1">
                      ${selectedService.links.map(link => `
                        <a 
                          href="${link.url}"
                          target="_blank"
                          rel="noopener noreferrer"
                          class="w-full py-4 rounded-xl bg-gradient-to-r from-white to-zinc-200 text-black font-extrabold text-sm flex items-center justify-center shadow-lg transition-all hover:scale-[1.02] hover:shadow-[0_0_20px_rgba(255,255,255,0.3)] active:scale-[0.98]"
                        >
                          ${link.label} 
                          <svg class="w-5 h-5 ml-1 stroke-[2.5]" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" /></svg>
                        </a>
                      `).join('')}
                    </div>
                  </div>
                `;
            } else {
                hudContainer.innerHTML = `
                  <div class="flex flex-col justify-center items-center text-center p-4 py-8">
                    <div class="w-16 h-16 rounded-full border border-dashed border-zinc-700 flex items-center justify-center mb-6 text-zinc-500 animate-[spin_60s_linear_infinite]">
                      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="transform -rotate-45"><path d="M12 20h.01" /><path d="M8.5 16.5c3-3 4-3 7 0" /><path d="M5 13a11.5 11.5 0 0 1 14 0" /><path d="M1.5 9.5a19.6 19.6 0 0 1 21 0" /></svg>
                    </div>
                    <h4 class="text-xl font-bold text-zinc-200 mb-2 tracking-wide">Netlife Feel HUB</h4>
                    <p class="text-zinc-500 text-sm max-w-sm leading-relaxed font-light mb-6">
                      Haz clic sobre las bobinas eléctricas o iconos del reactor para descubrir tu portafolio de soluciones.
                    </p>

                    <button 
                      onclick="openAiDiagnostic()"
                      class="w-full py-3.5 bg-zinc-950 border border-orange-500/20 rounded-xl text-orange-400 font-extrabold text-xs uppercase tracking-widest hover:border-orange-500/50 hover:bg-orange-500/5 active:scale-[0.99] transition-all flex items-center justify-center space-x-2 shadow-[0_0_20px_rgba(249,115,22,0.05)]"
                    >
                      <svg class="w-4 h-4 text-orange-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275Z" /><path d="m5 3 1 2.5L8.5 6 6 7 5 9.5 4 7 1.5 6 4 5.5Z" /><path d="m19 17 1 2.5 2.5.5-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1Z" /></svg>
                      <span>Auditoría de Hogar Inteligente IA</span>
                    </button>
                  </div>
                `;
            }
        }
    </script>
</body>
</html>
