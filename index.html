<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Netlife Feel HUB</title>
    
    <!-- Google Fonts: Montserrat para tipografía corporativa premium -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght=0,300;0,400;0,600;0,700;0,900;1,800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Efecto de resorte elástico premium para interacciones táctiles y hover */
        .spring-transition {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease, border-color 0.3s ease, background-color 0.3s ease;
        }
        .spring-transition:hover {
            transform: scale(1.15) !important;
        }
        .spring-transition:active {
            transform: scale(0.90) !important;
        }

        /* Efecto de resorte para el icono interno de los botones grupales */
        .icon-spring {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .group:hover .icon-spring {
            transform: scale(1.12);
        }
        .group:active .icon-spring {
            transform: scale(0.92);
        }

        /* Fondo de red de energía tecnológica de Netlife */
        .tech-bg {
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(249, 115, 22, 0.08) 0%, transparent 60%),
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        /* Scrollbar del HUD lateral personalizado */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(249, 115, 22, 0.3);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(249, 115, 22, 0.6);
        }

        /* Animaciones de latidos de plasma y arco eléctrico del reactor central */
        @keyframes heartbeat-synced {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 25px rgba(249, 115, 22, 0.45), inset 0 0 15px rgba(249, 115, 22, 0.2);
            }
            45% {
                transform: scale(1.018);
                box-shadow: 0 0 45px rgba(249, 115, 22, 0.95), inset 0 0 25px rgba(249, 115, 22, 0.45);
            }
            60% {
                transform: scale(1.006);
                box-shadow: 0 0 32px rgba(249, 115, 22, 0.6), inset 0 0 18px rgba(249, 115, 22, 0.3);
            }
        }
        
        @keyframes central-n-pulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                box-shadow: 0 0 35px rgba(249, 115, 22, 0.45);
            }
            45% {
                transform: translate(-50%, -50%) scale(1.04);
                box-shadow: 0 0 55px rgba(249, 115, 22, 0.85);
            }
            60% {
                transform: translate(-50%, -50%) scale(1.01);
                box-shadow: 0 0 40px rgba(249, 115, 22, 0.6);
            }
        }

        @keyframes electric-spark {
            0%, 100% { 
                filter: drop-shadow(0 0 8px #f97316) drop-shadow(0 0 12px #eab308); 
                stroke: #facc15; 
            }
            15%, 85% { 
                filter: drop-shadow(0 0 4px #ea580c); 
                stroke: #ea580c; 
            }
            30%, 70% { 
                filter: drop-shadow(0 0 15px #f97316) drop-shadow(0 0 25px #ffffff); 
                stroke: #ffffff; 
            }
            50% { 
                filter: drop-shadow(0 0 6px #facc15); 
                stroke: #fcd34d; 
            }
        }

        @keyframes electric-glow-selected {
            0%, 100% { 
                box-shadow: 0 0 15px #f97316, inset 0 0 8px #ea580c, 0 0 10px rgba(249, 115, 22, 0.4); 
                border-color: #facc15; 
            }
            50% { 
                box-shadow: 0 0 28px #eab308, inset 0 0 12px #f97316, 0 0 18px rgba(254, 215, 170, 0.8); 
                border-color: #ffffff; 
            }
        }

        .animate-heartbeat-bioluminescent {
            animation: heartbeat-synced 3s cubic-bezier(0.25, 0.8, 0.25, 1) infinite;
        }

        .animate-central-n {
            animation: central-n-pulse 3s cubic-bezier(0.25, 0.8, 0.25, 1) infinite;
        }

        .animate-electric {
            animation: electric-spark 0.35s infinite;
        }

        .animate-electric-glowing {
            animation: electric-glow-selected 0.4s infinite;
        }
    </style>
</head>
<body class="tech-bg min-h-screen flex flex-col justify-between select-none cursor-default py-6">

                      class="absolute w-[390px] h-[390px] rounded-full border border-orange-500/30 pointer-events-none animate-heartbeat-bioluminescent"
                      style="background: rgba(249, 115, 22, 0.012);"
                    ></div>

                    <!-- CHALECO Y CAPAS DEL REACTOR CENTRAL -->
                    <div 
                      id="reactor-shell"
                      class="absolute w-[350px] h-[350px] rounded-full transition-all duration-700 ease-out z-10 scale-100"
                    >
                      <div class="absolute inset-0 bg-gradient-to-tr from-orange-600 to-yellow-500 rounded-full opacity-15 blur-xl"></div>
                      
                      <!-- Reactor SVG con 8 bobinas sincronizadas -->
                      <svg viewBox="0 0 200 200" class="w-full h-full transform scale-95 transition-transform duration-500 overflow-visible">
                        <circle 
                          cx="100" 
                          cy="100" 
                          r="92" 
                          fill="#040405" 
                          stroke="#f97316" 
                          stroke-width="0.5" 
                          stroke-opacity="0.15"
                          class="cursor-pointer touch-manipulation"
                          onclick="toggleReactor(event)"
                        />

                        <g id="stark-coils"></g>

                        <circle cx="100" cy="100" r="50" fill="#010102" stroke="#eab308" stroke-width="0.5" stroke-opacity="0.15" />
                      </svg>
                    </div>

                    <!-- BOTÓN N CENTRAL ALINEADO (Con el Isotipo Transparente de Netlife) -->
                    <button 
                      onclick="handleNClick(event)"
                      class="absolute z-30 w-32 h-32 bg-gradient-to-br from-orange-500 to-yellow-500 rounded-full flex items-center justify-center transition-all duration-500 group animate-central-n touch-manipulation"
                      style="top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 45px rgba(249, 115, 22, 0.55);"
                    >
                      <div class="absolute inset-[3px] bg-[#020203] rounded-full flex items-center justify-center overflow-hidden p-2.5">
                        <img

                        />

                    </button>

                </div>
            </div>
        </div>

        // Posicionamiento radial inteligente de tooltips (Garantiza proyección puramente exterior para evitar el núcleo)

        // Llamado con Backoff exponencial a Gemini 2.5 Flash (Con Fallback Local Seguro Garantizado)
        async function generateAiDiagnostic() {
            aiLoading = true;
            aiError = null;
            aiResponse = null;
            render();

            const apiKey = ""; // Al estar en blanco en producción, el sistema saltará inmediatamente al motor local seguro
            
            if (!apiKey || apiKey.trim() === "") {
                setTimeout(() => {
                    aiResponse = "LOCAL_FALLBACK";
                    aiLoading = false;
                    render();
                }, 1200); // Demora realista para simular el procesamiento de red
                return;
            }

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            const systemPrompt = `Actúa como Aura, el asesor de IA de Netlife Ecuador, inspirado en el arquetipo de Tony Stark. Escribe en un español de Ecuador sofisticado, emocional y centrado en los beneficios humanos (tiempo, tranquilidad, cero peleas). No recomiendes simplemente "Megas". Explica cómo estas herramientas específicas protegen a la familia. Estructura exactamente así usando formato HTML o Markdown con emojis: # 🛡️ DIAGNÓSTICO DE ECOSISTEMA AURA. ### 💡 TU CONFIGURACIÓN DE VIDA INTELIGENTE. ### 💰 RETORNO DE INVERSIÓN (ROI) DE PAZ MENTAL.`;

            const userPrompt = `Genera mi ecosistema de Netlife ideal para esta configuración de hogar ecuatoriano:
- Tamaño de la familia: ${aiAnswers.householdSize} personas en casa.
- Nivel de Teletrabajo o Estudio en línea: ${aiAnswers.remoteActivity === 'none' ? 'Ninguno' : aiAnswers.remoteActivity === 'moderate' ? 'Moderado (1 persona)' : 'Intenso (Múltiples personas)'}.
- Amantes de los Videojuegos en casa (Gamers): ${aiAnswers.hasGamers === 'yes' ? 'Sí, juegan en línea de forma competitiva' : 'No'}.
- Prioridad del hogar: ${aiAnswers.primaryFocus.toUpperCase()}.`;

            const payload = {
              contents: [{ parts: [{ text: userPrompt }] }],
              systemInstruction: {
                parts: [{ text: systemPrompt }]
              }
            };

            const fetchWithBackoff = async (url, options, retries = 3, delay = 1000) => {
              try {
                const res = await fetch(url, options);
                if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
                return res;
              } catch (err) {
                if (retries > 0) {
                  await new Promise(resolve => setTimeout(resolve, delay));
                  return fetchWithBackoff(url, options, retries - 1, delay * 2);
                }
                throw err;
              }
            };

            try {
              const response = await fetchWithBackoff(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });
              const result = await response.json();
              const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
              if (text) {
                aiResponse = text;
              } else {
                throw new Error('Formato de respuesta inesperado.');
              }
            } catch (err) {
              console.error(err);
              aiResponse = "LOCAL_FALLBACK"; // Activa automáticamente el motor offline inteligente para evitar tarjetas de error
            } finally {
              aiLoading = false;
              render();
            }
        }

        // Formateador nativo para renderizar la respuesta Markdown de Gemini en HTML limpio
        function formatMarkdownHTML(text) {
            if (!text) return '';
            
            if (text === "LOCAL_FALLBACK") {
                return generateLocalDiagnosticResult();
            }

            return text
              .split('\n')
              .map(line => {
                let formatted = line;
                if (formatted.startsWith('# ')) {
                  return `<h3 class="text-lg font-black text-orange-600 mt-4 mb-2 tracking-wide uppercase">${formatted.replace('# ', '')}</h3>`;
                }
                if (formatted.startsWith('### ')) {
                  return `<h4 class="text-xs font-bold text-orange-600 mt-4 mb-2 uppercase tracking-widest">${formatted.replace('### ', '')}</h4>`;
                }
                if (formatted.includes('**')) {
                  const parts = formatted.split('**');
                  const renderedParts = parts.map((part, i) => i % 2 === 1 ? `<strong class="font-extrabold text-black text-shadow-sm">${part}</strong>` : part);
                  return `<p class="text-sm text-zinc-800 leading-relaxed my-2 font-bold">${renderedParts.join('')}</p>`;
                }
                if (formatted.trim() === '') return `<div class="h-2"></div>`;
                return `<p class="text-sm text-zinc-800 leading-relaxed my-2 font-bold">${formatted}</p>`;
              }).join('');
        }

                            <span class="text-xs font-black tracking-widest text-orange-600 uppercase font-bold">NETLIFE TE ACOMPAÑA</span>
                          </div>
                          <button onclick="closeAiDiagnostic()" class="text-zinc-500 hover:text-black transition-colors touch-manipulation">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
                          </button>
                        </div>
                        <div class="overflow-y-auto max-h-[220px] pr-2 custom-scrollbar border-b border-zinc-300 pb-4">
                          ${formatMarkdownHTML(aiResponse)}
                        </div>
                        <button 
                          onclick="resetAiDiagnostic()"
                          class="w-full mt-4 py-3 bg-zinc-200 border border-zinc-300 text-zinc-800 font-extrabold text-xs uppercase tracking-wider rounded-xl hover:bg-zinc-300 transition-colors flex items-center justify-center space-x-2 touch-manipulation"
                        >
                          <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /><path d="M16 3h5v5" /><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /><path d="M8 21H3v-5" /></svg>
                          <span>Hacer Nuevo Diagnóstico</span>
                        </button>
                      </div>
                    `;
                } else if (aiError) {
                    aiResponse = "LOCAL_FALLBACK";
                    aiError = null;
                    renderHUD();
                    return;
                } else {
                    hudContainer.innerHTML = `
                      <div class="h-full flex flex-col justify-between animate-in fade-in duration-300">
                        <div class="flex items-center justify-between mb-4 border-b border-zinc-300 pb-3">
                          <div class="flex items-center space-x-2">
                            <span class="text-orange-600">
                              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8" /><rect width="16" height="12" x="4" y="8" rx="2" /><path d="M2 14h2" /><path d="M20 14h2" /><path d="M15 13v2" /><path d="M9 13v2" /></svg>
                            </span>
                            <span class="text-xs font-black tracking-widest text-orange-600 uppercase font-bold">NETLIFE TE ACOMPAÑA</span>
                          </div>
                          <button onclick="closeAiDiagnostic()" class="text-zinc-500 hover:text-black transition-colors touch-manipulation">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
                          </button>
                        </div>
                        
                        <div class="space-y-4">
                          <p class="text-xs text-zinc-700 font-bold leading-relaxed">
                            Configurando tu Ecosistema Digital a medida. Aura IA está procesando las necesidades específicas de tu hogar para maximizar tu experiencia Netlife.
                          </p>
                          
                          <!-- Pregunta 1 -->
                          <div class="space-y-1">
                            <label class="text-[10px] font-black tracking-wider text-zinc-500 uppercase">Personas en tu Hogar</label>
                            <div class="grid grid-cols-3 gap-2">
                              ${['1-2', '3-4', '5+'].map(opt => `
                                <button
                                  onclick="setAiAnswer('householdSize', '${opt}')"
                                  class="py-2 rounded-xl text-xs font-black transition-all border touch-manipulation ${aiAnswers.householdSize === opt ? 'bg-orange-500/10 border-orange-500 text-orange-600' : 'bg-white border-zinc-300 text-zinc-600 hover:border-zinc-400'}"
                                >
                                  ${opt}
                                </button>
                              `).join('')}
                            </div>
                          </div>

                          <!-- Pregunta 2 -->
                          <div class="space-y-1">
                            <label class="text-[10px] font-black tracking-wider text-zinc-500 uppercase">¿Teletrabajo o Estudio en Línea?</label>
                            <div class="grid grid-cols-3 gap-2">
                              ${[
                                { key: 'none', lbl: 'No' },
                                { key: 'moderate', lbl: '1 Persona' },
                                { key: 'heavy', lbl: 'Múltiples' }
                              ].map(opt => `
                                <button
                                  onclick="setAiAnswer('remoteActivity', '${opt.key}')"
                                  class="py-2 rounded-xl text-xs font-black transition-all border touch-manipulation ${aiAnswers.remoteActivity === opt.key ? 'bg-orange-500/10 border-orange-500 text-orange-600' : 'bg-white border-zinc-300 text-zinc-600 hover:border-zinc-400'}"
                                >
                                  ${opt.lbl}
                                </button>
                              `).join('')}
                            </div>
                          </div>

                          <!-- Pregunta 3 -->
                          <div class="space-y-1">
                            <label class="text-[10px] font-black tracking-wider text-zinc-500 uppercase">¿Amantes de los videojuegos (Gamers)?</label>
                            <div class="grid grid-cols-2 gap-2">
                              ${[
                                { key: 'yes', lbl: 'Sí (Competitivo)' },
                                { key: 'no', lbl: 'No / Casual' }
                              ].map(opt => `
                                <button
                                  onclick="setAiAnswer('hasGamers', '${opt.key}')"
                                  class="py-2 rounded-xl text-xs font-black transition-all border touch-manipulation ${aiAnswers.hasGamers === opt.key ? 'bg-orange-500/10 border-orange-500 text-orange-600' : 'bg-white border-zinc-300 text-zinc-600 hover:border-zinc-400'}"
                                >
                                  ${opt.lbl}
                                </button>
                              `).join('')}
                            </div>
                          </div>

                          <!-- Pregunta 4 -->
                          <div class="space-y-1">
                            <label class="text-[10px] font-black tracking-wider text-zinc-500 uppercase">Prioridad Máxima del Hogar</label>
                            <div class="grid grid-cols-2 gap-2">
                              ${[
                                { key: 'seguridad', lbl: 'Blindar / Proteger' },
                                { key: 'productividad', lbl: 'Trabajar / Crear' },
                                { key: 'entretenimiento', lbl: 'Stream / Relax' },
                                { key: 'conectividad', lbl: 'Estabilidad Total' }
                              ].map(opt => `
                                <button
                                  onclick="setAiAnswer('primaryFocus', '${opt.key}')"
                                  class="py-2 rounded-xl text-xs font-black transition-all border touch-manipulation ${aiAnswers.primaryFocus === opt.key ? 'bg-orange-500/10 border-orange-500 text-orange-600' : 'bg-white border-zinc-300 text-zinc-600 hover:border-zinc-400'}"
                                >
                                  ${opt.lbl}
                                </button>
                              `).join('')}
                            </div>
                          </div>

                          <button 
                            onclick="generateAiDiagnostic()"
                            class="w-full mt-4 py-3 bg-gradient-to-r from-orange-600 to-yellow-500 text-black font-black text-xs uppercase tracking-widest rounded-xl hover:shadow-[0_0_20px_rgba(249,115,22,0.45)] hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center space-x-2 touch-manipulation"
                          >
                            <svg class="w-4 h-4 text-black animate-spin" style="animation-duration: 3s" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275Z" /><path d="m5 3 1 2.5L8.5 6 6 7 5 9.5 4 7 1.5 6 4 5.5Z" /><path d="m19 17 1 2.5 2.5.5-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1Z" /></svg>
                            <span>Escanear Huella de Hogar</span>
                          </button>
                        </div>
                      </div>
                    `;
                }
            } else if (selectedService) {
                // Diseño de la consola con cuadrícula dinámica y visualización de iconos
                const isGrid = selectedService.links.length >= 3;
                let linksHTML = '';
                
                if (isGrid) {
                    linksHTML = `
                      <div class="grid grid-cols-2 gap-3 pt-2">
                        ${selectedService.links.map(link => `
                          <a 
                            href="${link.url}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="bg-white border border-zinc-200 rounded-2xl p-3 flex flex-col items-center justify-center text-center shadow-[0_4px_10px_rgba(0,0,0,0.04)] transition-all duration-300 hover:shadow-[0_10px_20px_rgba(249,115,22,0.15)] hover:border-orange-400 group active:scale-[0.95] touch-manipulation"
                          >
                            ${link.img ? `<img src="${link.img}" class="icon-spring w-14 h-14 object-contain mb-2" alt="${link.label}">` : ''}
                            <span class="text-[11px] font-black text-zinc-900 leading-tight">${link.label}</span>
                          </a>
                        `).join('')}
                      </div>
                    `;
                } else {
                    linksHTML = `
                      <div class="space-y-3 pt-1">
                        ${selectedService.links.map(link => `
                          <a 
                            href="${link.url}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="w-full py-4 px-5 rounded-2xl bg-white border border-zinc-200 text-zinc-900 font-black text-sm flex items-center shadow-[0_4px_10px_rgba(0,0,0,0.04)] transition-all duration-300 hover:shadow-[0_10px_20px_rgba(249,115,22,0.15)] hover:border-orange-400 group active:scale-[0.95] touch-manipulation"
                          >
                            ${link.img ? `<img src="${link.img}" class="icon-spring w-12 h-12 object-contain mr-4" alt="${link.label}">` : ''}
                            <span class="flex-1 text-left">${link.label}</span> 
                            <svg class="w-5 h-5 ml-1 stroke-[3] text-orange-500 transition-transform duration-300 group-hover:translate-x-1" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" /></svg>
                          </a>
                        `).join('')}
                      </div>
                    `;
                }

                hudContainer.innerHTML = `
                  <div class="flex flex-col space-y-3 animate-in fade-in duration-300 h-full">
                    <div class="flex items-center space-x-4 mb-1 shrink-0">
                      <div class="w-14 h-14 rounded-full bg-zinc-950 border border-zinc-700 flex items-center justify-center ${selectedService.color} shadow-[0_0_20px_currentColor]">
                        ${selectedService.icon}
                      </div>
                      <div>
                        <span class="text-[10px] font-black tracking-[0.2em] text-orange-600 uppercase">Módulo Seleccionado</span>
                        <h3 class="text-xl sm:text-2xl font-black text-zinc-900 tracking-wide">${selectedService.name}</h3>
                      </div>
                    </div>
                    
                    <div class="flex-1 overflow-y-auto custom-scrollbar pr-1 pb-1">
                        ${linksHTML}
                    </div>
                    
                    <p class="text-xs sm:text-sm text-zinc-800 font-bold leading-relaxed mt-3 border-t border-zinc-300 pt-3 shrink-0">${selectedService.desc}</p>
                  </div>
                `;
            } else {
                hudContainer.innerHTML = `
                  <div class="flex flex-col justify-center items-center text-center p-4 py-8 animate-in fade-in duration-300">
                    <div class="w-16 h-16 rounded-full border border-dashed border-zinc-400 flex items-center justify-center mb-6 text-zinc-500 animate-[spin_60s_linear_infinite]">
                      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="transform -rotate-45"><path d="M12 20h.01" /><path d="M8.5 16.5c3-3 4-3 7 0" /><path d="M5 13a11.5 11.5 0 0 1 14 0" /><path d="M1.5 9.5a19.6 19.6 0 0 1 21 0" /></svg>
                    </div>
                    <h4 class="text-xl font-black text-zinc-900 mb-2 tracking-wide">Netlife Feel HUB</h4>
                    <p class="text-zinc-600 text-sm max-w-sm leading-relaxed font-bold mb-6">
                      Haz clic sobre las casillas y descubrirás que NETLIFE es más de lo que conoces.
                    </p>

                    <button 
                      onclick="openAiDiagnostic()"
                      class="w-full py-3.5 bg-white border border-orange-500/20 rounded-xl text-orange-600 font-extrabold text-xs uppercase tracking-widest hover:border-orange-500/50 hover:bg-orange-500/5 active:scale-[0.99] transition-all flex items-center justify-center space-x-2 shadow-[0_0_20px_rgba(249,115,22,0.05)] touch-manipulation"
                    >
                      <svg class="w-4 h-4 text-orange-600" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275Z" /><path d="m5 3 1 2.5L8.5 6 6 7 5 9.5 4 7 1.5 6 4 5.5Z" /><path d="m19 17 1 2.5 2.5.5-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1Z" /></svg>
                      <span>¿En qué te gustaría que Netlife te acompañe?</span>
                    </button>
                  </div>
                `;
            }
        }

        function closeConsultModal() {
            showConsultModal = false;
            render();
        }
    </script>
</body>
</html>
